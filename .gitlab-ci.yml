#image: monachus/hugo
#image: yitsushi/hugo-extended-builder
#image: mashehu/hugo-extended-npm
#
# @darix Hugo (extended) + Node
#variables:
#    GIT_SUBMODULE_STRATEGY: recursive

stages:
    - build
    - deploy
    - pages

build:
    stage: build
    image: registry.opensuse.org/home/darix/apps/containers/opensuse-hugo:latest
    script:
        - hugo version
        - cd themes/rt-hugo/assets; npm install; cd ../../../;
        - hugo -d public_deploy
    artifacts:
        paths:
            - public
    only:
        - master

deploy:
    stage: deploy
    image: alpine:latest
    tags:
        - private
    before_script:
        - apk update && apk add openssh-client bash rsync
    script:
        - ls public_deploy
        - rsync --version
    only:
        - master

pages:
    stage: pages
    before_script:
        - zypper refresh && zypper install rsync
    script:
        - hugo version
        - cd themes/rt-hugo/assets; npm install; cd ../../../;
        - hugo -d public_deploy
        - hugo --config config-gitlabpages.toml -b 'https://patdavid.gitlab.io/rawtherapee-web/'
        - ls public
        - ls public_deploy
        - rsync --version
        #- ls public
        #- hugo -d output
        #- mkdir public
        #- cp -R output/* public/
    artifacts:
        paths:
            - public
    only:
        - master
