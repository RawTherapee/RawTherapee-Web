#image: monachus/hugo
#image: yitsushi/hugo-extended-builder
#image: mashehu/hugo-extended-npm
#
# @darix Hugo (extended) + Node
#variables:
#    GIT_SUBMODULE_STRATEGY: recursive

stages:
    - pages
    - deploy

pages:
    stage: pages
    image: registry.opensuse.org/home/darix/apps/containers/opensuse-hugo:latest
    script:
        - hugo version
        - cd themes/rt-hugo/assets; npm install; cd ../../../;
          # This line is ready for when we move webhosts
          #- hugo -d public_deploy
        - hugo -d public_deploy -b 'https://rawtherapee.pixls.us'
        - hugo --config config-gitlabpages.toml -b 'https://patdavid.gitlab.io/rawtherapee-web/'
    artifacts:
        paths:
            - public
            - public_deploy
    only:
        - master

deploy:
    stage: deploy
    image: alpine:latest
    before_script:
        - apk update && apk add openssh-client bash rsync
          #- which ssh-agent
        - eval $(ssh-agent -s)
        - echo "$SSH_RT_PIXLS_B64" | base64 -d | ssh-add -
    script:
        - rsync -Pauvhe "ssh -o StrictHostKeyChecking=no -o LogLevel=error" public_deploy/ pixlsus@pixls.us:/home/pixlsus/rawtherapee.com/
    only:
        - master
