# variables used SSH_RT_PIXLS -> needs to be a file field in the settings. that saves us the ssh-agent step and the base64 encode

image: registry.opensuse.org/home/darix/apps/containers/opensuse-hugo:latest

stages:
    - pages
    - deploy

pages:
    stage: pages
    script:
        - hugo version
        - cd themes/rt-hugo/assets; npm install; cd ../../../;
          # This line is ready for when we move webhosts
          #- hugo -d public_deploy
        - hugo -v -d public_deploy -b 'https://rawtherapee.pixls.us'
        - hugo --config config-gitlabpages.toml -b 'https://patdavid.gitlab.io/rawtherapee-web/'
    artifacts:
        paths:
            - public
            - public_deploy
    only:
        - master

deploy:
    stage: deploy
    script:
        - rsync -Pauvhe "ssh -o StrictHostKeyChecking=no -i $SSH_RT_PIXLS -o LogLevel=error" public_deploy/ pixlsus@pixls.us:/home/pixlsus/rawtherapee.com/
    only:
        - master
