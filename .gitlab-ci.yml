stages:
    - pages
    - deploy
      #- pages

pages:
    stage: pages
    image: registry.opensuse.org/home/darix/apps/containers/opensuse-hugo:latest
    script:
        - hugo version
        - cd themes/rt-hugo/assets; npm install; cd ../../../;
        - hugo -d public_deploy
        - hugo --config config-gitlabpages.toml -b 'https://patdavid.gitlab.io/rawtherapee-web/'
    artifacts:
        paths:
            - public
            - public_deploy
    only:
        - master

deploy:
    stage: deploy
    image: alpine:latest
    before_script:
        - apk update && apk add openssh-client bash rsync
        - which ssh-agent
        - eval $(ssh-agent -s)
          #- echo "$SSH_RT_PIXLS" | tr -d '\r' | ssh-add -
        - mkdir -p ~/.ssh/ && chmod 700 ~/.ssh
        - echo "$SSH_RT_PIXLS"
        - echo "$SSH_RT_PIXLS" > ~/.ssh/rt-pixls_rsa && chmod 600 ~/.ssh/rt-pixls_rsa
        - echo "$SSH_RT_PIXLS" | ssh-add -
        - ssh-add ~/.ssh/rt-pixls_rsa
    script:
        - ls public && ls public_deploy
        - rsync --version
        - which ssh-agent
    only:
        - master

