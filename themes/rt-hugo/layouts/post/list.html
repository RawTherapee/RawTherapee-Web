{{ define "main" }}

<section class="page container">
    <h1 class="page-title">{{ .Title }}</h1>
    {{- range .Data.Pages.GroupByDate "2006" }}
    <div>
        <div class="post-year">{{ .Key }}</div>

        <ul class="posts">
            {{- range .Pages }}
            <li class="list-item">
		<a href="{{ .Permalink }}">{{ .Title }}</a>
		{{ if not .Date.IsZero }}
		<time>
                    {{- .Date.Format (.Site.Params.dateform | default "Jan 02, 2006") -}}
		</time>
		{{ end }}
            </li>
            {{- end }}
        </ul>
    </div>
    {{- end }}
</section>

{{ end }}
