baseURL = "http://example.org/"
languageCode = "en-us"
title = "RawTherapee"
theme = "rt-hugo"

metaDataFormat = "yaml"

paginate = 10
paginatePath = "page"

[permalinks]
    post = "/:year/:month/:slug/"
    blog = "/:year/:month/:slug/"
    news = "/:year/:month/:slug/"
    code = "/:slug/"

[taxonomies]
    tag = "tags"
    topic = "topics"

