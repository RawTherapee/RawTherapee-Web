#    email = "yourname@example.com"


[params]
    # Markdwon ok here?
    brand = "RawTherapee"
    topline = "Top line entry"
    footline = "foot line entry"

    #sidebar = "left"

    highlight = "default"

[blackfriday]
    angledQuotes = true
    fractions = true
    plainIDAnchors = true

