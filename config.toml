baseURL = "/"
languageCode = "en-us"
title = "RawTherapee"
theme = "rt-hugo"

metaDataFormat = "yaml"

pagination.pagerSize = 10
pagination.path = "page"

[permalinks]
    post = "/:year/:month/:slug/"
    blog = "/:year/:month/:slug/"
    news = "/:year/:month/:slug/"
    code = "/:slug/"

[taxonomies]
    tag = "tags"
    topic = "topics"

#[author]
#    name = "yourname"
#    email = "yourname@example.com"

[menu]
    [[menu.secondary]]
    identifier = "forum"
    name        = "Forum"
    url         = "https://discuss.pixls.us/rawtherapee"
    weight      = 1

    [[menu.secondary]]
    identifier  = "documentation"
    name        = "Documentation"
    url         = "https://rawpedia.rawtherapee.com"
    weight      = 2

    [[menu.secondary]]
    identifier  = "code"
    name        = "Code"
    url         = "https://github.com/Beep6581/RawTherapee"
    weight      = 3

[related]
    threshold = 0
    includeNewer = true
    toLower = true
    [[related.indices]]
      name = "tags"
      weight = 100

[params]
    # Markdwon ok here?
    brand = "RawTherapee"
    topline = "Top line entry"
    footline = "foot line entry"

    #sidebar = "left"

    highlight = "default"


[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.asciidocExt]
    backend = 'html5'
    extensions = []
    failureLevel = 'fatal'
    noHeaderOrFooter = true
    preserveTOC = false
    safeMode = 'unsafe'
    sectionNumbers = false
    trace = false
    verbose = false
    workingFolderCurrent = false
    [markup.asciidocExt.attributes]
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      linkifyProtocol = 'https'
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = 'github'
      [markup.goldmark.parser.attribute]
        block = false
        title = true
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    noHl = false
    style = 'monokai'
    tabWidth = 4
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2


[outputs]
  home = ["HTML", "RSS", "JSON"]
